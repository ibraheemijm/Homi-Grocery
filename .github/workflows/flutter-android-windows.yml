name: Flutter Windows checks

on:
  workflow_dispatch:
  push:
    branches: [feature/windows-ota-foundation]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Windows platform
        run: flutter create --platforms=windows .
      # يعالج تحذير MSVC STL1011 داخل local_auth_windows مع Visual Studio 2026.
      - name: Apply Windows MSVC compatibility definition
        shell: pwsh
        run: |
          $cmake = "windows/CMakeLists.txt"
          $source = Get-Content $cmake -Raw
          $marker = "project(runner LANGUAGES CXX)"
          if (-not $source.Contains($marker)) { throw "لم يتم العثور على نقطة إدراج تعريف توافق MSVC في CMakeLists.txt" }
          if (-not $source.Contains("_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS")) {
            $replacement = $marker + "`r`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
            $source = $source.Replace($marker, $replacement)
            Set-Content -Path $cmake -Value $source -NoNewline
          }
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build Windows desktop
        run: flutter build windows --release
      - name: Package Windows update bundle
        shell: pwsh
        run: |
          $bundle = Resolve-Path "build/windows/x64/runner/Release"
          Compress-Archive -Path "$($bundle.Path)/*" -DestinationPath "build/windows/homi-grocery-windows-x64.zip" -Force
      - name: Upload Windows bundle and update package
        uses: actions/upload-artifact@v4
        with:
          name: homi-grocery-windows-x64
          path: |
            app/build/windows/x64/runner/Release/
            app/build/windows/homi-grocery-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
