name: homi_grocery
description: Homi Grocery - Arabic-first offline grocery management for Android, Linux and Windows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  # مكتبات قاعدة SQLite المحلية لدعم Linux وAndroid وWindows.
  sqflite: ^2.4.2
  # تثبيت إصدار FFI المتوافق مع sqlite3 v2 لتجنب تنزيل مكتبة أصلية أثناء الاختبارات.
  sqflite_common_ffi: ">=2.3.7 <2.4.0"
  sqlite3: ^2.9.4
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.7
  pdf: ^3.11.3
  printing: ^5.14.2
  # تجزئة كلمات المرور محليًا باستخدام HMAC-SHA256.
  crypto: ^3.0.6
  # مفاتيح Ed25519 الخاصة بالجهاز وتحقق توقيعات الترخيص وتحديثات OTA على المنصات المدعومة.
  cryptography: ^2.7.0
  # قارئ باركود بالكاميرا على Android.
  mobile_scanner: ^7.5.0
  # المصادقة الحيوية والتخزين المشفر لبيانات الدخول على Android.
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  # مشاركة ملف سجل الأخطاء التشخيصي من Android دون توصيل الهاتف بالكمبيوتر.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/Amiri-Bold.ttf
    - assets/fonts/LICENSE-Cairo-OFL.txt
    - assets/fonts/LICENSE-Amiri-OFL.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
